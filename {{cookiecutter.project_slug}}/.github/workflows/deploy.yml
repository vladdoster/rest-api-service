{%- if cookiecutter.deploy_environments == "dev-staging-prod" %}
# Build once -> deploy dev -> deploy staging -> deploy prod. The same image
# DIGEST is promoted through every environment; ECR replication mirrors it
# from the dev registry into staging and prod automatically.
# One-time repo setup: create the prod environment under Settings > Environments
# and add required reviewers BEFORE the first push reaches deploy-prod. GitHub
# creates dev and staging, with no rules, the first time a job references them.
{%- else %}
# Build once via the platform's reusable image workflow, then deploy to dev.
# Staging/prod jobs are omitted; add them back following
# examples/echo-service/.github/workflows/deploy.yml in platform-infra
# (same digest, promoted through the environments).
{%- endif %}
name: deploy

on:
  push:
    branches: [main]
    # release pushes use GITHUB_TOKEN and cannot trigger this workflow; the ignores document intent
    paths-ignore:
      - CHANGELOG.md
      - VERSION
      - 'releasenotes/**'
  # manual runs deploy the dispatched ref; dispatch a release/X.Y branch to ship a hotfix
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  # builds once in the dev account and returns a digest-pinned reference; the
  # publish role's OIDC trust only admits this platform workflow (job_workflow_ref)
  image:
    uses: {{ cookiecutter.github_org }}/platform-infra/.github/workflows/service-image.yml@main
    with:
      service: {{ cookiecutter.project_slug }}

  deploy-dev:
    needs: image
    # no secrets: AWS access is OIDC and the platform workflows read platform-infra through a composite action
    uses: {{ cookiecutter.github_org }}/platform-infra/.github/workflows/service-deploy.yml@main
    with:
      service: {{ cookiecutter.project_slug }}
      environment: dev
      image: {% raw %}${{ needs.image.outputs.image }}{% endraw %}
{%- if cookiecutter.deploy_environments == "dev-staging-prod" %}

  deploy-staging:
    needs: [image, deploy-dev]
    uses: {{ cookiecutter.github_org }}/platform-infra/.github/workflows/service-deploy.yml@main
    with:
      service: {{ cookiecutter.project_slug }}
      environment: staging
      image: {% raw %}${{ needs.image.outputs.image }}{% endraw %}

  deploy-prod:
    needs: [image, deploy-staging]
    uses: {{ cookiecutter.github_org }}/platform-infra/.github/workflows/service-deploy.yml@main
    with:
      service: {{ cookiecutter.project_slug }}
      environment: prod
      image: {% raw %}${{ needs.image.outputs.image }}{% endraw %}
{%- endif %}
