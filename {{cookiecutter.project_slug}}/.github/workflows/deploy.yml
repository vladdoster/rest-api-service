{%- if cookiecutter.deploy_environments == "dev-staging-prod" %}
# Build once -> deploy dev -> deploy staging -> deploy prod. The same image
# DIGEST is promoted through every environment; ECR replication mirrors it
# from the dev registry into staging and prod automatically.
# One-time repo setup: create environments dev, staging, prod under
# Settings > Environments, and add required reviewers on prod.
{%- else %}
# Build once, deploy to dev. Staging/prod jobs are omitted; add them back
# following examples/echo-service/.github/workflows/deploy.yml in
# platform-infra (same digest, promoted through the environments).
{%- endif %}
{% raw %}name: deploy

on:
  push:
    branches: [main]
    # release pushes use GITHUB_TOKEN and cannot trigger this workflow; the ignores document intent
    paths-ignore:
      - CHANGELOG.md
      - VERSION
      - 'releasenotes/**'
  # manual runs deploy the dispatched ref; dispatch a release/X.Y branch to ship a hotfix
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  SERVICE: {% endraw %}{{ cookiecutter.project_slug }}{% raw %}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      # full history so `git describe` can walk from HEAD to the nearest release tag
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # publish-only role; deploy jobs assume the per-service role via the platform's reusable workflow
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_DEV }}:role/gha-ecr-publish-dev
          aws-region: ${{ vars.AWS_REGION }}

      - name: Push image to the dev registry
        id: push
        env:
          REGISTRY: ${{ vars.AWS_ACCOUNT_ID_DEV }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
        run: |
          REPO="svc/${SERVICE}"
          aws ecr describe-repositories --repository-names "$REPO" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "$REPO" \
              --image-scanning-configuration scanOnPush=true \
              --image-tag-mutability IMMUTABLE
          # redeploys reuse this commit's pushed digest: tags are immutable and rebuilds change the digest
          if DIGEST=$(aws ecr describe-images --repository-name "$REPO" \
                --image-ids imageTag="${GITHUB_SHA}" \
                --query 'imageDetails[0].imageDigest' --output text 2>/dev/null); then
            echo "image=$REGISTRY/$REPO@$DIGEST" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)
          docker build -t "$REGISTRY/$REPO:${GITHUB_SHA}" \
            --build-arg APP_VERSION="${TAG}-${GITHUB_SHA::7}" .
          docker push "$REGISTRY/$REPO:${GITHUB_SHA}"
          DIGEST=$(aws ecr describe-images --repository-name "$REPO" \
            --image-ids imageTag="${GITHUB_SHA}" \
            --query 'imageDetails[0].imageDigest' --output text)
          echo "image=$REGISTRY/$REPO@$DIGEST" >> "$GITHUB_OUTPUT"
{% endraw %}

  deploy-dev:
    needs: build
    uses: {{ cookiecutter.github_org }}/platform-infra/.github/workflows/service-deploy.yml@main
    # forwards PLATFORM_REPO_TOKEN, required while platform-infra is private
    secrets: inherit
    with:
      service: {{ cookiecutter.project_slug }}
      environment: dev
      image: {% raw %}${{ needs.build.outputs.image }}{% endraw %}
{%- if cookiecutter.deploy_environments == "dev-staging-prod" %}

  deploy-staging:
    needs: [build, deploy-dev]
    uses: {{ cookiecutter.github_org }}/platform-infra/.github/workflows/service-deploy.yml@main
    secrets: inherit
    with:
      service: {{ cookiecutter.project_slug }}
      environment: staging
      image: {% raw %}${{ needs.build.outputs.image }}{% endraw %}

  deploy-prod:
    needs: [build, deploy-staging]
    uses: {{ cookiecutter.github_org }}/platform-infra/.github/workflows/service-deploy.yml@main
    secrets: inherit
    with:
      service: {{ cookiecutter.project_slug }}
      environment: prod
      image: {% raw %}${{ needs.build.outputs.image }}{% endraw %}
{%- endif %}
