[alembic]
script_location = %(here)s/migrations
# repo root on sys.path so migrations/env.py can import the app package
prepend_sys_path = .
path_separator = os
# no sqlalchemy.url here: migrations/env.py builds it from app settings (DB_* env vars)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
